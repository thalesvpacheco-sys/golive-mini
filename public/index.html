<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GoLive Mini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<header>
  <h1 class="brand">🔴 GoLive Mini</h1>
  <div id="status-wrap">
    <span id="status">Não conectado</span>
    <span class="online-dot" id="online-dot"></span>
    <button id="share-room-btn" class="btn-ghost" style="display:none;">🔗 Compartilhar sala</button>
  </div>
</header>

<div id="join-section">
  <div id="name-bar">
    <input id="name-input" placeholder="Seu nome (aparece pros outros)" maxlength="24" />
  </div>
  <div id="join-bar">
    <input id="room-input" placeholder="ID da sala (combine com a galera)" />
    <button id="join-btn" class="btn-primary">Entrar na sala</button>
  </div>
</div>

<div id="app">
  <div id="echo-banner" hidden>
    <span>🎧 Use fone se os dois estiverem com áudio ligado, pra evitar eco.</span>
    <button id="echo-dismiss" aria-label="Fechar aviso">✕</button>
  </div>

  <div id="stage">
    <div id="stage-empty">
      <div class="stage-bubbles" id="stage-bubbles">
        <div class="bubble purple"></div>
        <div class="bubble pink"></div>
        <div class="bubble-glow"></div>
      </div>
      <div class="stage-actions">
        <button id="stage-screen-btn" class="btn-primary">🖥️ Compartilhar tela</button>
        <button id="stage-cam-btn" class="btn-secondary">📷 Ativar câmera</button>
      </div>
    </div>
    <div id="stage-main" hidden></div>
    <div id="camera-bubbles"></div>
    <div id="reactions-layer"></div>
  </div>

  <div id="control-bar">
    <button id="mic-btn" class="off" title="Mic">🎤</button>
    <button id="cam-btn" class="off" title="Câmera">📷</button>
    <button id="screen-btn" class="btn-secondary" title="Compartilhar tela">🖥️</button>
    <div class="reaction-wrap">
      <button id="reaction-btn" class="btn-secondary" title="Reação">😀</button>
      <div id="reaction-picker" hidden>
        <button data-emoji="❤️">❤️</button>
        <button data-emoji="😂">😂</button>
        <button data-emoji="😱">😱</button>
        <button data-emoji="👏">👏</button>
      </div>
    </div>
    <button id="leave-btn">🚪 Sair</button>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
