<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1B1229" />
<script>
  // aplica o tema salvo ANTES de qualquer CSS pintar a tela — script inline
  // e síncrono de propósito (roda antes do <link rel="stylesheet">). Sem
  // isso, a tela nasceria sempre roxa por uma fração de segundo e só
  // trocaria pro tema salvo depois que o módulo JS carregasse — um "flash"
  // visível toda vez que a pessoa abrir o app com tema branco/preto salvo.
  try {
    var t = localStorage.getItem('golive-theme');
    if (t === 'white' || t === 'black') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<title>GoLive Mini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<!-- lottie-web: o mesmo motor que o DotLottieReact (React) usa por baixo,
     só que em JS puro — dá pra tocar o MESMO arquivo .json de animação sem
     precisar de React/build step nenhum. -->
<script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<header>
  <h1 class="brand"><span class="logo-dot" aria-hidden="true"></span>GoLive Mini</h1>
  <div id="status-wrap">
    <span id="status" data-i18n="status.disconnected">Não conectado</span>
    <span class="online-dot" id="online-dot"></span>
    <div class="reaction-wrap">
      <button id="quality-btn" class="btn-ghost" title="Qualidade da transmissão" aria-label="Qualidade da transmissão" data-i18n-title="quality.title" data-i18n-aria="quality.title">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </button>
      <div id="quality-picker" class="popover-card" hidden>
        <button data-quality="high" data-i18n="quality.high">Alta (60fps)</button>
        <button data-quality="standard" data-i18n="quality.standard">Padrão (30fps)</button>
        <p class="quality-note" data-i18n="quality.note">Vale a partir da próxima vez que compartilhar a tela.</p>
      </div>
    </div>
    <button id="participants-btn" class="btn-ghost" style="display:none;" aria-label="Ver participantes" data-i18n-aria="aria.participants">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/><path d="M17 8a3 3 0 1 0 0-5.9"/><path d="M23 21v-2a5 5 0 0 0-3.5-4.77"/></svg>
    </button>
    <button id="share-room-btn" class="btn-ghost" style="display:none;" aria-label="Compartilhar sala" data-i18n-aria="share.button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 15l6-6"/><path d="M8.5 13.5l-2 2a3.5 3.5 0 0 0 5 5l3-3a3.5 3.5 0 0 0 0-5"/><path d="M15.5 10.5l2-2a3.5 3.5 0 0 0-5-5l-3 3a3.5 3.5 0 0 0 0 5"/></svg>
    </button>
    <div class="reaction-wrap">
      <button id="theme-btn" class="btn-ghost" title="Tema" aria-label="Tema" data-i18n-title="theme.title" data-i18n-aria="theme.title">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/></svg>
      </button>
      <div id="theme-picker" class="popover-card" hidden>
        <button data-theme-option="purple">
          <span class="theme-swatch theme-swatch-purple" aria-hidden="true"></span>
          <span data-i18n="theme.purple">Roxo</span>
        </button>
        <button data-theme-option="white">
          <span class="theme-swatch theme-swatch-white" aria-hidden="true"></span>
          <span data-i18n="theme.white">Branco</span>
        </button>
        <button data-theme-option="black">
          <span class="theme-swatch theme-swatch-black" aria-hidden="true"></span>
          <span data-i18n="theme.black">Preto</span>
        </button>
      </div>
    </div>
  </div>
</header>

<div id="join-section">
  <div class="join-hero">
    <div class="join-mascot" id="join-mascot" aria-hidden="true"></div>
    <p class="join-tagline" data-i18n="join.tagline">Compartilhem a tela e assistam juntos, mesmo longe.</p>
  </div>
  <div class="join-card">
    <div class="field">
      <label for="name-input" data-i18n="join.nameLabel">Seu nome</label>
      <div class="input-icon-wrap">
        <svg class="icon input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/></svg>
        <input id="name-input" placeholder="Como você aparece na sala" data-i18n-placeholder="join.namePlaceholder" maxlength="24" />
      </div>
    </div>
    <div class="field">
      <label for="room-input" data-i18n="join.roomLabel">Sala</label>
      <div id="join-bar">
        <div class="input-icon-wrap">
          <svg class="icon input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="room-input" placeholder="ID da sala (combinem um)" data-i18n-placeholder="join.roomPlaceholder" />
        </div>
        <button id="join-btn" class="btn-primary">
          <span data-i18n="join.button">Entrar</span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="app">
  <div id="toast-layer" aria-live="polite"></div>

  <div id="stage">
    <div id="stage-empty">
      <div class="stage-bubbles" id="stage-bubbles">
        <div class="bubble purple"></div>
        <div class="bubble pink"></div>
        <div class="bubble-glow"></div>
      </div>
      <div class="stage-actions">
        <button id="stage-screen-btn" class="btn-primary">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          <span data-i18n="action.shareScreen">Compartilhar tela</span>
        </button>
        <button id="stage-cam-btn" class="btn-secondary">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 8l4.5-2.5a1 1 0 0 1 1.5.9v11.2a1 1 0 0 1-1.5.9L15 16"/><rect x="2" y="6" width="13" height="12" rx="2"/></svg>
          <span data-i18n="action.enableCam">Ativar câmera</span>
        </button>
      </div>
    </div>
    <div id="stage-main" hidden></div>
    <div id="camera-bubbles"></div>
    <div id="reactions-layer"></div>
    <button id="fullscreen-btn" class="stage-icon-btn" title="Tela cheia" aria-label="Tela cheia" data-i18n-title="action.fullscreen" data-i18n-aria="action.fullscreen" hidden>
      <svg class="icon icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      <svg class="icon icon-compress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
    </button>
  </div>

  <div id="control-bar">
    <button id="mic-btn" class="off" title="Mic" aria-label="Ligar/desligar microfone" data-i18n-title="mic.title" data-i18n-aria="mic.aria">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/><line class="off-slash" x1="3" y1="3" x2="21" y2="21"/></svg>
    </button>
    <button id="cam-btn" class="off" title="Câmera" aria-label="Ligar/desligar câmera" data-i18n-title="cam.title" data-i18n-aria="cam.aria">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 8l4.5-2.5a1 1 0 0 1 1.5.9v11.2a1 1 0 0 1-1.5.9L15 16"/><rect x="2" y="6" width="13" height="12" rx="2"/><line class="off-slash" x1="1" y1="2" x2="23" y2="22"/></svg>
    </button>
    <div class="control-divider" aria-hidden="true"></div>
    <button id="screen-btn" class="btn-secondary" title="Compartilhar tela" aria-label="Compartilhar tela" data-i18n-title="action.shareScreen" data-i18n-aria="action.shareScreen">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    </button>
    <button id="cinema-btn" class="btn-secondary" title="Modo cinema (C)" aria-label="Modo cinema" data-i18n-title="cinema.title" data-i18n-aria="cinema.aria">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8l4-5h3l-3 5"/><path d="M9 8l4-5h3l-3 5"/><path d="M16 8l4-5h2v5"/><rect x="2" y="8" width="20" height="11" rx="2"/></svg>
    </button>
    <div class="control-divider" aria-hidden="true"></div>
    <button id="leave-btn" class="btn-pill">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 17.72V20a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h2.28a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11z"/><line x1="22" y1="2" x2="2" y2="22"/></svg>
      <span data-i18n="action.leave">Sair</span>
    </button>
  </div>

  <aside id="participants-panel" hidden>
    <div id="participants-panel-header">
      <h2><span data-i18n="panel.title">Participantes</span> <span id="participants-count">0</span></h2>
      <button id="participants-close" aria-label="Fechar participantes" data-i18n-aria="aria.closeParticipants">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </button>
    </div>
    <ul id="participants-list"></ul>
  </aside>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
