<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>myandyou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root {
    --bg: #1b1229;
    --bg-raised: #241a35;
    --purple: #8b5cf6;
    --purple-soft: #a78bfa;
    --pink: #e4789b;
    --pink-soft: #eb9db6;
    --text: #f3eefa;
    --text-dim: #b3a4cc;
    --online: #7fbf8f;
    --danger: #e4789b;
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
  }
  .brand { font-family: 'Fraunces', serif; font-weight: 500; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  header h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pink); flex-shrink: 0; }
  .dot.online { background: var(--online); }
  #status { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 14px; }

  button {
    font: inherit; border: none; cursor: pointer;
    border-radius: var(--radius-sm);
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  button:active { transform: scale(0.96); }
  button svg { width: 18px; height: 18px; flex-shrink: 0; }

  .btn-ghost {
    background: transparent; color: var(--text-dim);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 9px 14px; font-size: 13px; font-weight: 500;
  }
  .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.22); }

  .btn-primary {
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: #1b1229; font-weight: 600; font-size: 14px;
    padding: 11px 20px;
  }
  .btn-primary:hover { opacity: 0.92; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  input {
    font: inherit; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12); color: var(--text);
    border-radius: var(--radius-sm); padding: 11px 14px;
  }
  input::placeholder { color: var(--text-dim); }
  input:focus { outline: none; border-color: var(--purple-soft); }

  /* --- tela de entrada --- */
  #join-screen {
    max-width: 420px; margin: 12vh auto 0; padding: 0 24px;
    display: flex; flex-direction: column; gap: 14px; align-items: stretch;
  }
  #join-screen .tagline {
    text-align: center; color: var(--text-dim); font-size: 14px;
    margin: 0 0 8px;
  }
  #join-screen h1 { text-align: center; font-size: 30px; margin: 0 0 4px; }

  /* --- palco --- */
  #stage-wrap { display: none; flex-direction: column; height: calc(100vh - 65px); }
  #echo-banner {
    display: flex; align-items: center; gap: 10px;
    background: rgba(139,92,246,0.12); color: var(--text-dim);
    font-size: 13px; padding: 10px 20px;
  }
  #echo-banner svg { width: 16px; height: 16px; flex-shrink: 0; }
  #echo-banner button { margin-left: auto; background: none; color: var(--text-dim); padding: 4px; }

  #stage {
    flex: 1; margin: 20px 24px; border-radius: var(--radius);
    background: var(--bg-raised); position: relative;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #stage video.main-video {
    width: 100%; height: 100%; object-fit: contain; background: #000;
    display: none;
  }

  /* estado vazio: duas bolhas */
  #empty-stage { display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .bubbles { position: relative; width: 220px; height: 130px; }
  .bubble {
    position: absolute; top: 0; width: 130px; height: 130px; border-radius: 50%;
    filter: blur(0.3px); transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    animation: floaty 5s ease-in-out infinite;
  }
  .bubble.purple { left: 0; background: radial-gradient(circle at 35% 30%, var(--purple-soft), var(--purple)); animation-delay: 0s; }
  .bubble.pink { right: 0; background: radial-gradient(circle at 65% 30%, var(--pink-soft), var(--pink)); animation-delay: 0.3s; }
  .bubbles.merged .bubble.purple { transform: translateX(28px); }
  .bubbles.merged .bubble.pink { transform: translateX(-28px); }
  .bubbles.merged::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 60px; height: 60px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,255,255,0.35), transparent 70%);
    border-radius: 50%;
  }
  @keyframes floaty {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -10px; }
  }
  .empty-actions { display: flex; gap: 12px; }
  .empty-actions .btn-ghost { padding: 12px 20px; font-size: 14px; }

  /* bolhas de camera flutuantes */
  #camera-bubbles {
    position: absolute; bottom: 16px; right: 16px;
    display: flex; gap: 10px;
  }
  .cam-bubble {
    width: 96px; height: 96px; border-radius: 50%; overflow: hidden;
    border: 2px solid var(--purple); position: relative; background: #000;
    flex-shrink: 0;
  }
  .cam-bubble.pink { border-color: var(--pink); }
  .cam-bubble video { width: 100%; height: 100%; object-fit: cover; }
  .cam-bubble .cam-label {
    position: absolute; bottom: 2px; left: 0; right: 0; text-align: center;
    font-size: 10px; color: var(--text); background: rgba(0,0,0,0.5);
    padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cam-bubble.reconnecting { opacity: 0.5; }
  .cam-bubble.reconnecting::before {
    content: 'reconectando…'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; text-align: center; color: var(--text-dim); padding: 8px;
  }

  /* reacoes flutuantes */
  .reaction-pop {
    position: absolute; bottom: 20px; font-size: 32px;
    animation: floatUp 1.6s ease-out forwards; pointer-events: none;
  }
  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-160px); opacity: 0; }
  }

  /* barra de controles */
  #controls {
    display: none; align-items: center; justify-content: center; gap: 10px;
    padding: 16px 24px 22px;
  }
  .ctrl-btn {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--bg-raised); color: var(--text);
    justify-content: center; padding: 0;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.1); }
  .ctrl-btn.active { background: var(--purple); color: #1b1229; }
  .ctrl-btn.off { background: rgba(228,120,155,0.18); color: var(--pink); }
  .ctrl-btn.exit { background: var(--pink); color: #1b1229; }

  #reaction-picker {
    position: absolute; bottom: 78px; left: 50%; transform: translateX(-50%);
    background: var(--bg-raised); border-radius: 999px; padding: 8px 10px;
    display: none; gap: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  #reaction-picker button { background: none; padding: 4px; font-size: 20px; border-radius: 50%; }
  #reaction-picker button:hover { background: rgba(255,255,255,0.08); }
</style>
</head>
<body>

<header>
  <h1><span class="dot" id="header-dot"></span><span class="brand">myandyou</span></h1>
  <div id="status">
    <span id="status-text">não conectado</span>
    <button class="btn-ghost" id="share-btn" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
      compartilhar sala
    </button>
  </div>
</header>

<div id="join-screen">
  <h1 class="brand">myandyou</h1>
  <p class="tagline">um lugar só seu, pra assistir junto.</p>
  <input id="name-input" placeholder="seu nome" />
  <input id="room-input" placeholder="id da sala (ex: nossa-sala)" />
  <button class="btn-primary" id="join-btn" style="justify-content:center;">entrar</button>
</div>

<div id="stage-wrap">
  <div id="echo-banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
    use fone se os dois estiverem com áudio ligado, pra evitar eco.
    <button id="echo-close" aria-label="fechar aviso">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div id="stage">
    <video id="main-video" class="main-video" autoplay playsinline></video>
    <div id="empty-stage">
      <div class="bubbles" id="bubbles">
        <div class="bubble purple"></div>
        <div class="bubble pink"></div>
      </div>
      <div class="empty-actions">
        <button class="btn-ghost" id="screen-btn-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          compartilhar tela
        </button>
        <button class="btn-ghost" id="cam-btn-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4V8Z"/></svg>
          ativar câmera
        </button>
      </div>
    </div>
    <div id="camera-bubbles"></div>
    <div id="reaction-picker">
      <button data-emoji="❤️">❤️</button>
      <button data-emoji="😂">😂</button>
      <button data-emoji="😱">😱</button>
      <button data-emoji="👏">👏</button>
    </div>
  </div>

  <div id="controls">
    <button class="ctrl-btn off" id="mic-btn" aria-label="microfone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m2 2 20 20"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33M9 9v3a3 3 0 0 0 5.12 2.12"/><path d="M12 19v3"/></svg>
    </button>
    <button class="ctrl-btn off" id="cam-btn" aria-label="câmera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m2 2 20 20"/><path d="M9.5 4h5L16 6h3a2 2 0 0 1 2 2v9.5M2 6.5V16a2 2 0 0 0 2 2h11.5"/></svg>
    </button>
    <button class="ctrl-btn" id="screen-btn" aria-label="compartilhar tela">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </button>
    <button class="ctrl-btn" id="reaction-btn" aria-label="reação">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
    </button>
    <button class="ctrl-btn exit" id="exit-btn" aria-label="sair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </div>
</div>

<script>
  const socket = io();
  let peer, localStream = null, myName = '', myColor = 'purple';
  const calls = {};       // peerId -> MediaConnection
  const peerNames = {};   // peerId -> nome
  const peerColors = {};  // peerId -> 'purple' | 'pink'
  const leftIntentionally = new Set();
  let sharingScreen = false;
  let joinedCount = 0;

  const el = (id) => document.getElementById(id);

  // --- pre-preencher nome/sala salvos ---
  const params = new URLSearchParams(location.search);
  const savedRoom = params.get('room') || localStorage.getItem('golive-last-room') || '';
  el('room-input').value = savedRoom;

  el('join-btn').onclick = joinRoom;
  el('echo-close').onclick = () => el('echo-banner').style.display = 'none';
  setTimeout(() => { const b = el('echo-banner'); if (b) b.style.display = 'none'; }, 8000);

  el('screen-btn-empty').onclick = () => activateScreen();
  el('cam-btn-empty').onclick = () => activateCamera();
  el('mic-btn').onclick = toggleMic;
  el('cam-btn').onclick = toggleCam;
  el('screen-btn').onclick = () => activateScreen();
  el('exit-btn').onclick = () => location.reload();
  el('reaction-btn').onclick = () => {
    const p = el('reaction-picker');
    p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
  };
  document.querySelectorAll('#reaction-picker button').forEach((btn) => {
    btn.onclick = () => {
      sendReaction(btn.dataset.emoji, true);
      el('reaction-picker').style.display = 'none';
    };
  });
  el('share-btn').onclick = () => {
    const url = new URL(location.href);
    url.searchParams.set('room', el('room-input').value || currentRoom);
    navigator.clipboard.writeText(url.toString());
    el('share-btn').textContent = 'link copiado';
    setTimeout(() => { el('share-btn').innerHTML = shareBtnHTML; }, 1600);
  };
  const shareBtnHTML = el('share-btn').innerHTML;

  let currentRoom = '';

  async function joinRoom() {
    const roomId = el('room-input').value.trim();
    myName = el('name-input').value.trim() || 'anônimo';
    if (!roomId) return alert('digita um id de sala.');
    currentRoom = roomId;
    localStorage.setItem('golive-last-room', roomId);

    // getUserMedia so acontece aqui, no momento real de entrar -- nao antes
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    localStream.getAudioTracks().forEach(t => t.enabled = false);
    localStream.getVideoTracks().forEach(t => t.enabled = false);

    el('join-screen').style.display = 'none';
    el('stage-wrap').style.display = 'flex';
    el('controls').style.display = 'flex';
    el('share-btn').style.display = 'inline-flex';

    peer = new Peer(undefined, {
      host: location.hostname,
      port: location.port || (location.protocol === 'https:' ? 443 : 80),
      path: '/peerjs',
      secure: location.protocol === 'https:'
    });

    peer.on('open', (peerId) => {
      el('status-text').textContent = `conectado (sala: ${roomId})`;
      el('header-dot').classList.add('online');
      socket.emit('join-room', { roomId, peerId, name: myName });
    });

    socket.on('user-joined', ({ peerId: newPeerId, name }) => {
      joinedCount++;
      peerNames[newPeerId] = name;
      peerColors[newPeerId] = joinedCount % 2 === 1 ? 'pink' : 'purple';
      mergeBubbles();
      const call = peer.call(newPeerId, localStream, { metadata: { name: myName } });
      registerCall(newPeerId, call);
    });

    socket.on('user-left', (goneId) => {
      leftIntentionally.add(goneId);
      removeCamBubble(goneId);
    });

    socket.on('media-state', ({ peerId, kind, enabled }) => {
      // reservado para indicadores futuros (mic/cam do outro lado)
    });

    socket.on('screen-share', ({ peerId, sharing }) => {
      if (sharing) {
        // outro lado comecou a compartilhar -- damos espaco visual mostrando o video dele no palco
      }
    });

    socket.on('reaction', ({ emoji }) => sendReaction(emoji, false));

    peer.on('call', (call) => {
      call.answer(localStream);
      const theirName = call.metadata && call.metadata.name;
      if (theirName) peerNames[call.peer] = theirName;
      if (!(call.peer in peerColors)) {
        joinedCount++;
        peerColors[call.peer] = joinedCount % 2 === 1 ? 'pink' : 'purple';
      }
      mergeBubbles();
      registerCall(call.peer, call);
    });
  }

  function mergeBubbles() {
    el('bubbles').classList.add('merged');
  }

  function registerCall(peerId, call) {
    calls[peerId] = call;
    call.on('stream', (remoteStream) => addCamBubble(peerId, remoteStream));
    call.on('close', () => {
      setTimeout(() => {
        if (!leftIntentionally.has(peerId)) {
          markReconnecting(peerId);
        } else {
          removeCamBubble(peerId);
        }
      }, 600);
    });
  }

  function addCamBubble(peerId, stream) {
    let bubble = document.getElementById('cam-' + peerId);
    if (!bubble) {
      bubble = document.createElement('div');
      bubble.className = 'cam-bubble ' + (peerColors[peerId] || 'purple');
      bubble.id = 'cam-' + peerId;
      bubble.innerHTML = `<video autoplay playsinline></video><span class="cam-label"></span>`;
      el('camera-bubbles').appendChild(bubble);
    }
    bubble.querySelector('video').srcObject = stream;
    bubble.querySelector('.cam-label').textContent = peerNames[peerId] || 'anônimo';
    bubble.classList.remove('reconnecting');
  }

  function markReconnecting(peerId) {
    const bubble = document.getElementById('cam-' + peerId);
    if (bubble) bubble.classList.add('reconnecting');
  }

  function removeCamBubble(peerId) {
    const bubble = document.getElementById('cam-' + peerId);
    if (bubble) bubble.remove();
  }

  async function activateCamera() {
    localStream.getVideoTracks().forEach(t => t.enabled = true);
    el('cam-btn').classList.remove('off');
    el('cam-btn').classList.add('active');
    addCamBubble('local', localStream);
    document.getElementById('cam-local').querySelector('.cam-label').textContent = myName + ' (você)';
    socket.emit('media-state', { kind: 'video', enabled: true });
  }

  function toggleCam() {
    const track = localStream.getVideoTracks()[0];
    if (!track || !track.enabled) return activateCamera();
    track.enabled = false;
    el('cam-btn').classList.add('off');
    el('cam-btn').classList.remove('active');
    removeCamBubble('local');
    socket.emit('media-state', { kind: 'video', enabled: false });
  }

  function toggleMic() {
    const track = localStream.getAudioTracks()[0];
    const enabled = !track.enabled;
    track.enabled = enabled;
    el('mic-btn').classList.toggle('off', !enabled);
    el('mic-btn').classList.toggle('active', enabled);
    socket.emit('media-state', { kind: 'audio', enabled });
  }

  async function activateScreen() {
    let screenStream;
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    } catch (e) { return; }

    const newTrack = screenStream.getVideoTracks()[0];
    Object.values(calls).forEach((call) => {
      const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) sender.replaceTrack(newTrack);
    });

    const oldTrack = localStream.getVideoTracks()[0];
    if (oldTrack) { localStream.removeTrack(oldTrack); oldTrack.stop(); }
    localStream.addTrack(newTrack);

    el('main-video').srcObject = new MediaStream([newTrack]);
    el('main-video').style.display = 'block';
    el('empty-stage').style.display = 'none';
    sharingScreen = true;
    socket.emit('screen-share', { sharing: true });

    newTrack.onended = () => {
      el('main-video').style.display = 'none';
      el('empty-stage').style.display = 'flex';
      sharingScreen = false;
      socket.emit('screen-share', { sharing: false });
    };
  }

  function sendReaction(emoji, broadcast) {
    if (broadcast) socket.emit('reaction', { emoji });
    const pop = document.createElement('div');
    pop.className = 'reaction-pop';
    pop.textContent = emoji;
    pop.style.left = (40 + Math.random() * 20) + '%';
    el('stage').appendChild(pop);
    setTimeout(() => pop.remove(), 1600);
  }
</script>

</body>
</html>
