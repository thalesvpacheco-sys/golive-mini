<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GoLive Mini</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif;
    background: #09090b; color: #f4f4f5; min-height: 100vh;
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid #27272a;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; }
  #status { font-size: 13px; color: #a1a1aa; }
  #join-bar { display: flex; gap: 8px; padding: 16px 24px; flex-wrap: wrap; }
  input, button {
    font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid #3f3f46;
  }
  input { background: #18181b; color: #f4f4f5; flex: 1; min-width: 160px; }
  button {
    background: #3b82f6; color: white; border: none; cursor: pointer; font-weight: 600;
  }
  button:hover { background: #2563eb; }
  button.secondary { background: #27272a; }
  button.secondary:hover { background: #3f3f46; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #controls { display: none; gap: 8px; padding: 0 24px 16px; flex-wrap: wrap; }
  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px; padding: 0 24px 24px;
  }
  .tile { position: relative; background: #18181b; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
  .tile video { width: 100%; height: 100%; object-fit: cover; }
  .tile .label {
    position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,.6);
    padding: 2px 8px; border-radius: 6px; font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>🔴 GoLive Mini</h1>
  <div id="status">Não conectado</div>
</header>

<div id="join-bar">
  <input id="room-input" placeholder="ID da sala (combine com a galera)" />
  <button id="join-btn">Entrar na sala</button>
</div>

<div id="controls">
  <button id="cam-btn" class="secondary">📷 Câmera</button>
  <button id="screen-btn" class="secondary">🖥️ Compartilhar tela</button>
  <button id="mute-btn" class="secondary">🎤 Mutar</button>
</div>

<div id="grid"></div>

<script>
  const socket = io();
  let peer, localStream;
  const calls = {}; // peerId -> MediaConnection
  let micEnabled = true;

  const joinBar = document.getElementById('join-bar');
  const controls = document.getElementById('controls');
  const statusEl = document.getElementById('status');
  const grid = document.getElementById('grid');

  document.getElementById('join-btn').onclick = joinRoom;
  document.getElementById('cam-btn').onclick = () => switchStream('camera');
  document.getElementById('screen-btn').onclick = () => switchStream('screen');
  document.getElementById('mute-btn').onclick = toggleMic;

  async function joinRoom() {
    const roomId = document.getElementById('room-input').value.trim();
    if (!roomId) return alert('Digita um ID de sala, mano.');

    statusEl.textContent = 'Pedindo acesso à câmera/mic...';
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    addTile('local', localStream, 'Você');

    peer = new Peer(undefined, {
      host: location.hostname,
      port: location.port || (location.protocol === 'https:' ? 443 : 80),
      path: '/peerjs',
      secure: location.protocol === 'https:'
    });

    peer.on('open', (peerId) => {
      statusEl.textContent = `Conectado (sala: ${roomId})`;
      joinBar.style.display = 'none';
      controls.style.display = 'flex';
      socket.emit('join-room', { roomId, peerId });
    });

    // alguem chegou depois de mim -> eu ligo pra ele
    socket.on('user-joined', (newPeerId) => {
      const call = peer.call(newPeerId, localStream);
      registerCall(newPeerId, call);
    });

    socket.on('user-left', (goneId) => removeTile(goneId));

    // alguem me ligando -> eu atendo
    peer.on('call', (call) => {
      call.answer(localStream);
      registerCall(call.peer, call);
    });
  }

  function registerCall(peerId, call) {
    calls[peerId] = call;
    call.on('stream', (remoteStream) => addTile(peerId, remoteStream, peerId.slice(0, 6)));
    call.on('close', () => removeTile(peerId));
  }

  function addTile(id, stream, label) {
    if (document.getElementById('tile-' + id)) return;
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.id = 'tile-' + id;
    tile.innerHTML = `<video autoplay playsinline ${id === 'local' ? 'muted' : ''}></video><span class="label">${label}</span>`;
    tile.querySelector('video').srcObject = stream;
    grid.appendChild(tile);
  }

  function removeTile(id) {
    const tile = document.getElementById('tile-' + id);
    if (tile) tile.remove();
    delete calls[id];
  }

  // troca a fonte de video (camera <-> tela) sem derrubar as chamadas
  async function switchStream(type) {
    let newStream;
    try {
      newStream = type === 'screen'
        ? await navigator.mediaDevices.getDisplayMedia({ video: true })
        : await navigator.mediaDevices.getUserMedia({ video: true });
    } catch (e) { return; } // usuario cancelou o picker

    const newVideoTrack = newStream.getVideoTracks()[0];
    const oldVideoTrack = localStream.getVideoTracks()[0];

    // troca em cada conexao ja aberta (nao precisa renegociar do zero)
    Object.values(calls).forEach((call) => {
      const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) sender.replaceTrack(newVideoTrack);
    });

    localStream.removeTrack(oldVideoTrack);
    oldVideoTrack.stop();
    localStream.addTrack(newVideoTrack);
    document.querySelector('#tile-local video').srcObject = localStream;

    // se parar de compartilhar tela pelo botao nativo do navegador, volta pra camera
    if (type === 'screen') {
      newVideoTrack.onended = () => switchStream('camera');
    }
  }

  function toggleMic() {
    micEnabled = !micEnabled;
    localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
    document.getElementById('mute-btn').textContent = micEnabled ? '🎤 Mutar' : '🔇 Mutado';
  }
</script>

</body>
</html>
